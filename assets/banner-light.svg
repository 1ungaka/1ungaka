<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Lunga Ngaka, aspiring SOC analyst</title>
<desc id="d">Banner with a terminal showing ATT&amp;CK-mapped alerts from the soc-log-triage tool.</desc>
<style>
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; }
  .line { animation: show .45s ease-out backwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes show { from { opacity: 0; transform: translateX(-6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#eaeef2" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset=".55" stop-color="#ffffff" stop-opacity=".2"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="330" rx="14" fill="#ffffff"/>
<rect width="1200" height="330" rx="14" fill="url(#grid)"/>
<rect width="1200" height="330" rx="14" fill="url(#fade)"/>
<rect x=".5" y=".5" width="1199" height="329" rx="14" fill="none" stroke="#d0d7de"/>

<g class="sans">
  <text x="56" y="86" font-size="14" font-weight="600" letter-spacing="2.5" fill="#0969da">BLUE TEAM  ·  SECURITY OPERATIONS</text>
  <text x="54" y="146" font-size="54" font-weight="700" fill="#1f2328">Lunga Ngaka</text>
  <text x="56" y="186" font-size="19" fill="#59636e">Aspiring SOC Analyst. I build detections and triage</text>
  <text x="56" y="212" font-size="19" fill="#59636e">tools, and test them against realistic attack data.</text>
</g>
<g class="sans"><rect x="56" y="240" width="178" height="30" rx="15" fill="#0969da14" stroke="#0969da" stroke-opacity=".35"/><text x="145" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#0550ae">Detection engineering</text></g>
<g class="sans"><rect x="243.6" y="240" width="109" height="30" rx="15" fill="#0969da14" stroke="#0969da" stroke-opacity=".35"/><text x="298" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#0550ae">Log analysis</text></g>
<g class="sans"><rect x="362.79999999999995" y="240" width="132" height="30" rx="15" fill="#0969da14" stroke="#0969da" stroke-opacity=".35"/><text x="429" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#0550ae">Incident triage</text></g>
<g class="sans"><rect x="504.79999999999995" y="240" width="109" height="30" rx="15" fill="#0969da14" stroke="#0969da" stroke-opacity=".35"/><text x="559" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#0550ae">MITRE ATT&amp;CK</text></g>
<g>
  <rect x="640" y="40" width="516" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M640 50a10 10 0 0 1 10-10h496a10 10 0 0 1 10 10v22H640z" fill="#eaeef2"/>
  <circle cx="660" cy="56" r="5.5" fill="#ff5f57"/><circle cx="678" cy="56" r="5.5" fill="#febc2e"/><circle cx="696" cy="56" r="5.5" fill="#28c840"/>
  <text x="898.0" y="61" class="mono" font-size="12" text-anchor="middle" fill="#59636e">soc-log-triage</text>
</g>
<text x="658" y="102" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:.2s"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328"> soc-triage scan logs/* --min-severity high</tspan></text>
<text x="658" y="128" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:0.70s"><tspan fill="#cf222e" font-weight="700">[CRITICAL] </tspan><tspan fill="#1f2328">AUTH-003  </tspan><tspan fill="#59636e">root login after 24 failures </tspan><tspan fill="#0969da">T1110</tspan></text>
<text x="658" y="154" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:1.15s"><tspan fill="#cf222e" font-weight="700">[CRITICAL] </tspan><tspan fill="#1f2328">ACCT-003  </tspan><tspan fill="#59636e">new account added to sudo    </tspan><tspan fill="#0969da">T1098</tspan></text>
<text x="658" y="180" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:1.60s"><tspan fill="#bc4c00" font-weight="700">[HIGH]     </tspan><tspan fill="#1f2328">KERB-001  </tspan><tspan fill="#59636e">kerberoasting, 4 RC4 tickets </tspan><tspan fill="#0969da">T1558.003</tspan></text>
<text x="658" y="206" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:2.05s"><tspan fill="#bc4c00" font-weight="700">[HIGH]     </tspan><tspan fill="#1f2328">EXEC-002  </tspan><tspan fill="#59636e">winword.exe -&gt; powershell    </tspan><tspan fill="#0969da">T1204.002</tspan></text>
<text x="658" y="232" class="mono line" font-size="13.5" xml:space="preserve" style="animation-delay:2.50s"><tspan fill="#bc4c00" font-weight="700">[HIGH]     </tspan><tspan fill="#1f2328">EVADE-001 </tspan><tspan fill="#59636e">security log cleared         </tspan><tspan fill="#0969da">T1685.005</tspan></text>
<text x="658" y="262" class="mono line" font-size="13.5" style="animation-delay:2.95s"><tspan fill="#1a7f37">$</tspan></text><rect class="cursor" x="672" y="250" width="8" height="15" fill="#1f2328"/>
</svg>
